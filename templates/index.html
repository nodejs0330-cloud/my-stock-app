{% extends 'base.html' %}

{% block content %}
<div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] hidden flex-col items-center justify-center transition-opacity">
    <div class="animate-spin rounded-full h-12 w-12 border-2 border-indigo-500 border-t-transparent mb-4"></div>
    <h2 class="text-white text-lg font-semibold tracking-tight">시스템 접속 중</h2>
    <p class="text-slate-400 text-xs mt-1 font-mono">보안 네트워크를 구성하고 있습니다.</p>
</div>

<div id="kitsch-text" class="absolute inset-0 flex flex-col items-center justify-center z-10 pointer-events-none transition-all duration-500">
    <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight text-center leading-tight transition-all duration-500">
        {{ main_text | safe }}
    </h1>
    
    <button id="show-login-btn" class="mt-8 pointer-events-auto bg-primary hover:bg-primary/90 text-primary-foreground font-semibold text-base py-3 px-8 rounded-full shadow-lg shadow-primary/20 transform transition active:scale-95 border border-white/20">
        로그인
    </button>
</div>

<div id="login-form-container" class="w-full max-w-sm bg-slate-900/90 rounded-2xl shadow-2xl p-6 backdrop-blur-2xl border border-white/10 relative z-20 mx-4 opacity-0 scale-95 pointer-events-none transition-all duration-300">
    <button id="close-login-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white font-medium text-xl transition-colors">&times;</button>

    <div class="flex justify-between items-center mb-6 pr-6">
        <div>
            <h2 class="text-xl font-bold text-white tracking-tight">로그인</h2>
            <p class="text-xs text-slate-400 mt-0.5">NCC STOCK 거래 플랫폼</p>
        </div>
        <div class="flex space-x-1">
            <button id="bg-toggle-btn" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 px-2.5 rounded-md transition-colors border border-white/10">
                배경변경
            </button>
            <button id="qr-toggle-btn" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 px-2.5 rounded-md transition-colors border border-white/10">
                QR 접속
            </button>
        </div>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 px-3 py-2 rounded-lg text-xs font-medium text-center">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form id="login-form" action="{{ url_for('index') }}" method="POST" class="space-y-4">
        <div>
            <label for="username" class="block text-xs font-medium text-slate-300 mb-1">아이디</label>
            <input type="text" id="username" name="username" required class="block w-full bg-slate-950/60 border border-white/10 rounded-lg py-2 px-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="아이디 입력">
        </div>
        <div>
            <label for="password" class="block text-xs font-medium text-slate-300 mb-1">비밀번호</label>
            <input type="password" id="password" name="password" required class="block w-full bg-slate-950/60 border border-white/10 rounded-lg py-2 px-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="••••••••">
        </div>
        <div class="pt-2">
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg focus:outline-none shadow-md transition-all active:scale-[0.98] text-sm">
                접속하기
            </button>
        </div>
    </form>
    <div class="mt-5 text-center">
        <p class="text-xs text-slate-400">계정이 없으신가요? <a href="{{ url_for('signup') }}" class="text-amber-400 hover:text-amber-300 font-semibold ml-1">회원가입 (5,000만원 지급)</a></p>
    </div>
</div>

<div id="qr-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-opacity">
    <div class="bg-slate-900 p-6 rounded-2xl shadow-2xl text-center relative max-w-xs w-full mx-4 border border-white/10">
        <button id="qr-close-btn" class="absolute top-3 right-4 text-slate-400 hover:text-white font-medium text-xl transition-colors">&times;</button>
        <h3 class="text-white font-bold text-base mb-4">모바일 접속 QR</h3>
        <div id="qrcode" class="flex justify-center mb-3 p-3 bg-white rounded-xl inline-block mx-auto"></div>
        <p class="text-[10px] text-slate-400 break-all font-mono bg-slate-950 p-2 rounded-lg border border-white/5" id="qr-url-text"></p>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const bgMode = "{{ bg_mode }}";
        const titleEl = document.querySelector('#kitsch-text h1');
        if (!titleEl) return;
        
        const textContent = titleEl.innerText.trim();
        
        if (bgMode === 'random') {
            document.body.style.backgroundImage = "url('https://picsum.photos/1920/1080?random=" + new Date().getTime() + "')";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            titleEl.className = "text-3xl md:text-5xl text-white tracking-tight text-center font-bold whitespace-pre-line";
            titleEl.innerText = textContent;
        } else {
            document.body.style.backgroundImage = "";
            titleEl.className = "text-3xl md:text-5xl font-black text-amber-300 tracking-tight text-center whitespace-pre-line";
            const lines = textContent.split('\n');
            if (lines.length > 1) {
                const lastLine = lines.pop();
                titleEl.innerHTML = lines.join('<br>') + `<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-amber-300 to-emerald-400 text-5xl md:text-7xl mt-2 block font-extrabold">${lastLine}</span>`;
            } else {
                titleEl.innerHTML = `<span class="text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-amber-300 to-emerald-400 text-5xl md:text-7xl block font-extrabold">${textContent}</span>`;
            }
        }
    });

    const loginForm = document.getElementById('login-form');
    if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
            if (this.classList.contains('submitting')) {
                e.preventDefault();
                return;
            }
            this.classList.add('submitting');
            
            const btn = document.getElementById('submit-btn');
            if(btn) {
                btn.disabled = true;
                btn.innerText = "접속 중...";
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            }

            const un = document.getElementById('username');
            const pw = document.getElementById('password');
            if(un) un.readOnly = true;
            if(pw) pw.readOnly = true;

            const overlay = document.getElementById('loading-overlay');
            if(overlay) {
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }
        });
    }
</script>
{% endblock %}
