{% extends 'base.html' %}

{% block content %}

<!-- 로그인 스피너 -->
<div id="loading-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-[100] hidden flex-col items-center justify-center transition-opacity">
    <div class="animate-spin rounded-full h-10 w-10 border-2 border-[#18181b] border-t-transparent mb-3"></div>
    <h2 class="text-[#09090b] text-sm font-bold tracking-tight bg-white px-4 py-2 rounded-xl border border-[#e4e4e7] shadow-lg">시스템 접속 중...</h2>
</div>

<!-- 텍스트 영역 -->
<div id="kitsch-text" class="absolute inset-0 flex flex-col items-center justify-center z-10 pointer-events-none transition-all duration-500">
    <h1 class="text-3xl md:text-5xl font-extrabold text-[#09090b] tracking-tight text-center leading-tight transition-all duration-500">
        {{ main_text | safe }}
    </h1>
    
    <button id="show-login-btn" class="mt-8 pointer-events-auto bg-[#18181b] hover:bg-[#27272a] text-white font-semibold text-sm py-3 px-8 rounded-xl shadow-sm transform transition active:scale-95 border border-[#18181b]">
        로그인
    </button>
</div>

<!-- 로그인 폼 영역 -->
<div id="login-form-container" class="w-full max-w-sm bg-white/95 rounded-2xl shadow-xl p-6 backdrop-blur-xl border border-[#e4e4e7] relative z-20 mx-4 opacity-0 scale-95 pointer-events-none transition-all duration-300">
    
    <button id="close-login-btn" class="absolute top-4 right-4 text-[#71717a] hover:text-[#09090b] font-medium text-xl transition-colors">&times;</button>

    <div class="flex justify-between items-center mb-6 pr-6">
        <div>
            <h2 class="text-lg font-bold text-[#09090b] tracking-tight">로그인</h2>
            <p class="text-[11px] text-[#71717a] mt-0.5">NCC STOCK 모의투자 플랫폼</p>
        </div>
        <div class="flex space-x-1">
            <button id="bg-toggle-btn" class="text-[10px] bg-[#f4f4f5] hover:bg-[#e4e4e7] text-[#09090b] py-1 px-2.5 rounded-md transition-colors border border-[#e4e4e7]">
                배경변경
            </button>
            <button id="qr-toggle-btn" class="text-[10px] bg-[#f4f4f5] hover:bg-[#e4e4e7] text-[#09090b] py-1 px-2.5 rounded-md transition-colors border border-[#e4e4e7]">
                QR 접속
            </button>
        </div>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 bg-[#f4f4f5] border border-[#e4e4e7] text-[#09090b] px-3 py-2 rounded-lg text-xs font-medium text-center">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form id="login-form" action="{{ url_for('index') }}" method="POST" class="space-y-4">
        <div>
            <label for="username" class="block text-xs font-medium text-[#71717a] mb-1">아이디</label>
            <input type="text" id="username" name="username" required class="block w-full bg-[#f4f4f5] border border-[#e4e4e7] rounded-lg py-2 px-3 text-xs text-[#09090b] placeholder-[#a1a1aa] focus:outline-none focus:ring-1 focus:ring-[#18181b] transition-all" placeholder="아이디를 입력하세요">
        </div>
        <div>
            <label for="password" class="block text-xs font-medium text-[#71717a] mb-1">비밀번호</label>
            <input type="password" id="password" name="password" required class="block w-full bg-[#f4f4f5] border border-[#e4e4e7] rounded-lg py-2 px-3 text-xs text-[#09090b] placeholder-[#a1a1aa] focus:outline-none focus:ring-1 focus:ring-[#18181b] transition-all" placeholder="••••••••">
        </div>
        <div class="pt-2">
            <button type="submit" id="submit-btn" class="w-full bg-[#18181b] hover:bg-[#27272a] text-white font-medium py-2.5 px-4 rounded-xl focus:outline-none shadow-sm transition-all active:scale-[0.98] text-xs">
                접속하기
            </button>
        </div>
    </form>
    <div class="mt-5 text-center">
        <p class="text-xs text-[#71717a]">계정이 없으신가요? <a href="{{ url_for('signup') }}" class="text-[#09090b] font-bold underline ml-1">회원가입 (5,000만원 지급)</a></p>
    </div>
</div>

<!-- QR 모달 -->
<div id="qr-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden flex items-center justify-center z-50 transition-opacity">
    <div class="bg-white p-6 rounded-2xl shadow-xl text-center relative max-w-xs w-full mx-4 border border-[#e4e4e7]">
        <button id="qr-close-btn" class="absolute top-3 right-4 text-[#71717a] hover:text-[#09090b] font-medium text-lg transition-colors">&times;</button>
        <h3 class="text-[#09090b] font-bold text-sm mb-4">모바일 접속 QR</h3>
        <div id="qrcode" class="flex justify-center mb-3 p-3 bg-white border border-[#e4e4e7] rounded-xl inline-block mx-auto shadow-inner"></div>
        <p class="text-[10px] text-[#71717a] break-all font-mono bg-[#f4f4f5] p-2 rounded-lg border border-[#e4e4e7]" id="qr-url-text"></p>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const bgMode = "{{ bg_mode }}";
        const titleEl = document.querySelector('#kitsch-text h1');
        if (!titleEl) return;
        
        const textContent = titleEl.innerText.trim();
        
        if (bgMode === 'random') {
            document.body.style.backgroundImage = "url('https://picsum.photos/1920/1080?random=" + new Date().getTime() + "')";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            titleEl.className = "text-3xl md:text-5xl text-[#09090b] tracking-tight text-center font-bold whitespace-pre-line";
            titleEl.innerText = textContent;
        } else {
            document.body.style.backgroundImage = "";
            titleEl.className = "text-3xl md:text-5xl font-black text-[#09090b] tracking-tight text-center whitespace-pre-line";
            const lines = textContent.split('\n');
            if (lines.length > 1) {
                const lastLine = lines.pop();
                titleEl.innerHTML = lines.join('<br>') + `<br><span class="text-[#09090b] text-5xl md:text-7xl mt-2 block font-extrabold">${lastLine}</span>`;
            } else {
                titleEl.innerHTML = `<span class="text-[#09090b] text-5xl md:text-7xl block font-extrabold">${textContent}</span>`;
            }
        }
    });

    const loginForm = document.getElementById('login-form');
    if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
            if (this.classList.contains('submitting')) {
                e.preventDefault();
                return;
            }
            this.classList.add('submitting');
            
            const btn = document.getElementById('submit-btn');
            if(btn) {
                btn.disabled = true;
                btn.innerText = "접속 중...";
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            }

            const un = document.getElementById('username');
            const pw = document.getElementById('password');
            if(un) un.readOnly = true;
            if(pw) pw.readOnly = true;

            const overlay = document.getElementById('loading-overlay');
            if(overlay) {
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }
        });
    }
</script>
{% endblock %}
