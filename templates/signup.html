{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-sm bg-white/95 rounded-2xl shadow-xl p-6 backdrop-blur-xl border border-[#e4e4e7] relative z-10 mx-4 my-8">
    <div class="mb-6 text-center">
        <h2 class="text-xl font-bold text-[#09090b] tracking-tight">회원가입</h2>
        <p class="text-[#71717a] mt-1 text-xs">가입 즉시 모의투자 지원금 <span class="text-[#09090b] font-bold font-mono">5,000만원</span>이 지급됩니다.</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 bg-[#f4f4f5] border border-[#e4e4e7] text-[#09090b] px-3 py-2 rounded-lg text-xs font-medium text-center">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('signup') }}" method="POST" class="space-y-4">
        <div>
            <label for="username" class="block text-xs font-medium text-[#71717a] mb-1">아이디</label>
            <input type="text" id="username" name="username" required class="block w-full bg-[#f4f4f5] border border-[#e4e4e7] rounded-lg py-2 px-3 text-xs text-[#09090b] placeholder-[#a1a1aa] focus:outline-none focus:ring-1 focus:ring-[#18181b] transition-all" placeholder="사용할 아이디 입력">
        </div>
        <div>
            <label for="name" class="block text-xs font-medium text-[#71717a] mb-1">닉네임 (이름)</label>
            <input type="text" id="name" name="name" required class="block w-full bg-[#f4f4f5] border border-[#e4e4e7] rounded-lg py-2 px-3 text-xs text-[#09090b] placeholder-[#a1a1aa] focus:outline-none focus:ring-1 focus:ring-[#18181b] transition-all" placeholder="사용할 닉네임 입력">
        </div>
        <div>
            <label for="password" class="block text-xs font-medium text-[#71717a] mb-1">비밀번호</label>
            <input type="password" id="password" name="password" required class="block w-full bg-[#f4f4f5] border border-[#e4e4e7] rounded-lg py-2 px-3 text-xs text-[#09090b] placeholder-[#a1a1aa] focus:outline-none focus:ring-1 focus:ring-[#18181b] transition-all" placeholder="••••••••">
        </div>
        
        <div class="pt-2">
            <button type="submit" class="w-full bg-[#18181b] hover:bg-[#27272a] text-white font-medium py-2.5 px-4 rounded-xl focus:outline-none shadow-sm transition-all active:scale-[0.98] text-xs">
                가입하고 지원금 받기
            </button>
        </div>
    </form>
    
    <div class="mt-5 text-center">
        <a href="{{ url_for('index') }}" class="text-xs text-[#71717a] hover:text-[#09090b] transition-colors">← 로그인 화면으로 돌아가기</a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const bgMode = "{{ bg_mode }}";
        
        if (bgMode === 'random') {
            document.body.style.backgroundImage = "url('https://picsum.photos/1920/1080?random=" + new Date().getTime() + "')";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
        } else {
            document.body.style.backgroundImage = "";
        }
    });
</script>
{% endblock %}
