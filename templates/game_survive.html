<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCS SURVIVE - {{ username }}님</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const GAME_WIDTH = isMobile ? 720 : 1280;
        const GAME_HEIGHT = isMobile ? 1280 : 720;

        let isMuted = false;
        let globalBGM = null;

        // 테스트 모드 전역 플래그 (비밀번호: 6974)
        let isTestMode = false;

        // DB에서 받아올 유저 글로벌 데이터 객체
        let USER_GLOBAL_DATA = {
            survive_gold: 0,
            upgrades: {
                attack_speed_lv: 0,
                move_speed_lv: 0,
                attack_power_lv: 0,
                max_hp_lv: 0,
                magnet_range_lv: 0,
                defense_lv: 0,
                exp_bonus_lv: 0
            },
            unlocked_boss_skills: []
        };

        function playBGM(scene, key) {
            if (globalBGM && globalBGM.key === key && globalBGM.isPlaying) {
                return; 
            }
            if (globalBGM) {
                globalBGM.stop();
                globalBGM.destroy();
            }
            if (scene.cache.audio.exists(key)) {
                globalBGM = scene.sound.add(key, { loop: true, volume: 0.5 });
                if (!isMuted) globalBGM.play();
            }
        }

        // 미래 구현용 몬스터/보스 SFX 레지스터 보존 (원칙 1)
        const MONSTER_SFX_REGISTRY = {
            boss_platypus_attack: ['boss_platypus_attack1', 'boss_platypus_attack2'],
            boss_thunder_strike:  ['boss_thunder_strike1',  'boss_thunder_strike2'],
            boss_armadillo_guard: ['boss_armadillo_guard1', 'boss_armadillo_guard2'],
            boss_panda_storm:     ['boss_panda_storm1',     'boss_panda_storm2'],
            boss_dragon_roar:     ['boss_dragon_roar1',     'boss_dragon_roar2'],
            boss_dragon_breath:   ['boss_dragon_breath1',   'boss_dragon_breath2'],
            skeleton_hit:         ['skeleton_hit1',         'skeleton_hit2'],
            bat_hit:              ['bat_hit1',              'bat_hit2'],
            goblin_attack:        ['goblin_attack1',        'goblin_attack2'],
            demon_hit:            ['demon_hit1',            'demon_hit2'],
            spider_hit:           ['spider_hit1',           'spider_hit2']
        };

        class MonsterSoundManager {
            static play(scene, key) {
                if (isMuted || !MONSTER_SFX_REGISTRY[key]) return;
                const candidates = MONSTER_SFX_REGISTRY[key];
                const selectedKey = candidates[Math.floor(Math.random() * candidates.length)];
                
                if (scene.cache.audio.exists(selectedKey)) {
                    scene.sound.play(selectedKey, { volume: 0.6 });
                } else if (scene.cache.audio.exists(candidates[0])) {
                    scene.sound.play(candidates[0], { volume: 0.6 });
                }
            }
        }

        function playRandomSFX(scene, baseKey, volume = 0.5) {
            if (isMuted) return;
            let num = Math.random() < 0.5 ? '1' : '2';
            let key = baseKey + num;
            
            if (scene.cache.audio.exists(key)) {
                scene.sound.play(key, { volume: volume });
            } else if (scene.cache.audio.exists(baseKey + '1')) {
                scene.sound.play(baseKey + '1', { volume: volume });
            }
        }

        function createMuteButton(scene) {
            let muteBtn = scene.add.text(scene.scale.width - 45, 80, isMuted ? '🔇' : '🔊', { 
                fontSize: '32px',
                padding: { top: 8, bottom: 8, left: 6, right: 6 } 
            })
            .setOrigin(0.5)
            .setScrollFactor(0)
            .setDepth(10000)
            .setInteractive();

            muteBtn.on('pointerdown', () => {
                playRandomSFX(scene, 'button');
                isMuted = !isMuted;
                scene.sound.mute = isMuted;
                muteBtn.setText(isMuted ? '🔇' : '🔊');
                if (globalBGM) {
                    isMuted ? globalBGM.pause() : globalBGM.resume();
                }
            });
            return muteBtn;
        }

        class PreloadScene extends Phaser.Scene {
            constructor() { super({ key: 'PreloadScene' }); }

            preload() {
                this.add.text(this.scale.width / 2, this.scale.height / 2, '데이터 불러오는 중...', { 
                    fontSize: '32px', fill: '#fff', padding: { top: 10, bottom: 10 } 
                }).setOrigin(0.5);

                this.load.image('main_bg', '/static/img/survive/main.png');
                this.load.image('game_start', '/static/img/survive/game_start.png');
                this.load.image('game_upgrade', '/static/img/survive/game_upgrade.png');
                
                this.load.image('boss_duck', '/static/img/survive/monster/duck/boss_duck.png');
                this.load.image('duck1', '/static/img/survive/monster/duck/duck1.png');
                this.load.image('duck2', '/static/img/survive/monster/duck/duck2.png');
                this.load.image('duck3', '/static/img/survive/monster/duck/duck3.png');
                this.load.image('golden_fish', '/static/img/survive/monster/duck/golden_fish.png');
                // 확장자 변경: duck_skill.jpeg -> duck_skill.png
                this.load.image('duck_skill', '/static/img/survive/monster/duck/duck_skill.png');

                // BGM 로드
                this.load.audio('survive_main', '/static/bgm/survive/survive_main.mp3');
                for (let i = 1; i <= 6; i++) {
                    this.load.audio(`stage${i}`, `/static/bgm/survive/stage${i}.mp3`);
                }
                this.load.audio('final_boss', '/static/bgm/survive/final_boss.mp3');

                // SFX 로드
                this.load.audio('button1', '/static/sfx/survive/button1.mp3');
                this.load.audio('button2', '/static/sfx/survive/button2.mp3');

                const sfxKeys = ['footstep', 'suri_throw', 'hit_impact', 'skill_fire', 'skill_water', 'skill_wind', 'skill_bomb', 'level_up', 'pickup', 'boss_warning', 'game_over', 'button'];
                sfxKeys.forEach(key => {
                    this.load.audio(`${key}1`, `/static/sfx/survive/${key}1.mp3`);
                    this.load.audio(`${key}2`, `/static/sfx/survive/${key}2.mp3`);
                });

                for(let i=1; i<=3; i++) this.load.audio(`skill_bolt${i}`, `/static/sfx/survive/skill_bolt${i}.mp3`);
                for(let i=1; i<=2; i++) this.load.audio(`boss_skill_used${i}`, `/static/sfx/survive/boss_skill_used${i}.mp3`);
                for(let i=1; i<=4; i++) this.load.audio(`stage1_skill${i}`, `/static/sfx/survive/stage1_skill${i}.mp3`);
                for(let i=1; i<=3; i++) this.load.audio(`hero_skill${i}`, `/static/sfx/survive/hero_skill${i}.mp3`);

                Object.keys(MONSTER_SFX_REGISTRY).forEach(key => {
                    this.load.audio(`${key}1`, `/static/sfx/survive/${key}1.mp3`);
                    this.load.audio(`${key}2`, `/static/sfx/survive/${key}2.mp3`);
                });

                this.load.image('hero_1', '/static/img/survive/hero/hero_1.png');
                this.load.image('hero_2', '/static/img/survive/hero/hero_2.png');
                this.load.image('hero_3', '/static/img/survive/hero/hero_3.png');
                this.load.image('hero_4', '/static/img/survive/hero/hero_4.png');
                this.load.image('hero_main', '/static/img/survive/hero/hero_main.png');
                this.load.image('hero_dead', '/static/img/survive/hero/hero_dead.png');

                this.load.image('suri', '/static/img/survive/eqi/suri.png');
                this.load.image('suri_vfx', '/static/img/survive/effect/suri_throw_vfx.png');
                this.load.image('fire_stream', '/static/img/survive/reword/fire_stream.png');
                this.load.image('water_dragon', '/static/img/survive/reword/water_dragon.png');
                this.load.image('rasenshuriken', '/static/img/survive/reword/rasenshuriken.png');
                this.load.image('explosive_shuriken', '/static/img/survive/reword/explosive_shuriken.png');
                this.load.image('explosion_vfx', '/static/img/survive/reword/explosion_vfx.png');
                this.load.image('bolt', '/static/img/survive/reword/bolt.png');
                this.load.image('scroll_bolt', '/static/img/survive/reword/scroll_bolt.png');

                this.load.image('earth_wall', '/static/img/survive/reword/earth_wall.png');
                this.load.image('scroll_earth_wall', '/static/img/survive/reword/scroll_earth_wall.png');
                this.load.image('ninja_posion', '/static/img/survive/reword/ninja_posion.png');
                
                this.load.image('ninja_hp_posion', '/static/img/survive/reword/ninja_hp_posion.png');
                this.load.image('ninja_speed', '/static/img/survive/reword/ninja_speed.png');
                this.load.image('clear_box', '/static/img/survive/reword/clear_box.png');

                this.load.image('meat', '/static/img/survive/reword/meat.png');
                this.load.image('field_magnet', '/static/img/survive/reword/magnet.png');

                this.load.image('sli_drop1', '/static/img/survive/monster/sli/sli_drop1.png');
                this.load.image('sli_drop3', '/static/img/survive/monster/sli/sli_drop3.png');

                this.load.image('box', '/static/img/survive/reword/box.png');
                this.load.image('rare_box', '/static/img/survive/reword/rare_box.png');
                this.load.image('scroll_fire_stream', '/static/img/survive/reword/scroll_fire_stream.png');
                this.load.image('scroll_water_dragon', '/static/img/survive/reword/scroll_water_dragon.png');
                this.load.image('scroll_rasenshuriken', '/static/img/survive/reword/scroll_rasenshuriken.png');
                this.load.image('scroll_explosive_shuriken', '/static/img/survive/reword/scroll_explosive_shuriken.png');
                this.load.image('scroll_pierce', '/static/img/survive/reword/scroll_pierce.png');
                this.load.image('scroll_clone', '/static/img/survive/reword/scroll_clone.png');
                this.load.image('scroll_magnet', '/static/img/survive/reword/scroll_magnet.png');
                
                this.load.image('goldpocket', '/static/img/survive/reword/goldpocket.png');

                ['sli', 'ssli'].forEach(prefix => {
                    for (let i = 1; i <= 4; i++) {
                        this.load.image(`${prefix}${i}`, `/static/img/survive/monster/sli/${prefix}${i}.png`);
                    }
                });

                // 타일 및 데코 리소스 로드
                this.load.image('grass1', '/static/img/survive/tile/grass1.png');
                this.load.image('grass4', '/static/img/survive/tile/grass4.png');
                this.load.image('grass5', '/static/img/survive/tile/grass5.png');
                this.load.image('branch', '/static/img/survive/tile/branch.png'); // 데코 나뭇가지 추가
                this.load.image('rock1', '/static/img/survive/tile/rock1.png');
                this.load.image('rock2', '/static/img/survive/tile/rock2.png');
                this.load.image('rock3', '/static/img/survive/tile/rock3.png');
                this.load.image('tree1', '/static/img/survive/tile/tree1.png');
                this.load.image('tree2', '/static/img/survive/tile/tree2.png');
            }

            create() {
                fetch('/api/survive/user_data')
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            USER_GLOBAL_DATA.survive_gold = data.survive_gold || 0;
                            USER_GLOBAL_DATA.upgrades = data.upgrades || USER_GLOBAL_DATA.upgrades;
                            USER_GLOBAL_DATA.unlocked_boss_skills = data.unlocked_boss_skills || [];
                        }
                        playBGM(this, 'survive_main');
                        this.scene.start('TitleScene');
                    })
                    .catch(err => {
                        console.error("유저 데이터 로드 오류:", err);
                        playBGM(this, 'survive_main');
                        this.scene.start('TitleScene');
                    });
            }
        }

        class TitleScene extends Phaser.Scene {
            constructor() { super({ key: 'TitleScene' }); }

            create() {
                playBGM(this, 'survive_main');
                let bg = this.add.image(this.scale.width / 2, this.scale.height / 2, 'main_bg');
                
                let scale;
                if (isMobile) {
                    let scaleX = this.scale.width / bg.width;
                    let scaleY = this.scale.height / bg.height;
                    scale = Math.min(scaleX, scaleY) * 1.15;
                    bg.setY(this.scale.height / 2 - 20);
                } else {
                    scale = Math.max(this.scale.width / bg.width, this.scale.height / bg.height);
                }
                bg.setScale(scale);

                createMuteButton(this);

                this.add.image(40, 40, 'goldpocket').setDisplaySize(32, 32).setScrollFactor(0);
                this.goldTxt = this.add.text(65, 40, `${USER_GLOBAL_DATA.survive_gold}`, { 
                    fontSize: '22px', fill: '#ffd700', fontStyle: 'bold', padding: { top: 4, bottom: 4 } 
                }).setOrigin(0, 0.5).setScrollFactor(0);

                let gearBtn = this.add.text(this.scale.width - 95, 80, '⚙️', { 
                    fontSize: '30px', padding: { top: 6, bottom: 6 } 
                }).setOrigin(0.5).setInteractive();
                
                gearBtn.on('pointerdown', () => {
                    playRandomSFX(this, 'button');
                    let pw = prompt("관리자 비밀번호를 입력하세요:");
                    if (pw === "6974") {
                        isTestMode = true;
                        alert("✅ [관리자 모드] 바로 보스 만나기 모드가 활성화되었습니다.\n(1분 뒤 보스 출현 / 시작 시 15개 보상 큐 지급 / DB 기록 없음)");
                    } else if (pw !== null) {
                        alert("❌ 비밀번호가 올바르지 않습니다.");
                    }
                });

                let baseSize = isMobile ? 240 : 275; 
                let startY = isMobile ? this.scale.height - 240 : this.scale.height - 140;
                let startX = isMobile ? this.scale.width / 2 - 140 : this.scale.width / 2 - 180;
                let upgradeX = isMobile ? this.scale.width / 2 + 140 : this.scale.width / 2 + 180;

                let startBtn = this.add.image(startX, startY, 'game_start').setDisplaySize(baseSize, baseSize).setInteractive();
                if(startBtn.preFX) {
                    startBtn.preFX.setPadding(32);
                    let startGlow = startBtn.preFX.addGlow(0xffcc00, 4, 0, false);
                    startGlow.active = false;
                    startBtn.on('pointerover', () => { 
                        startGlow.active = true; 
                        this.tweens.add({ targets: startBtn, scaleX: startBtn.scaleX * 1.05, scaleY: startBtn.scaleY * 1.05, duration: 100 });
                    });
                    startBtn.on('pointerout', () => { 
                        startGlow.active = false; 
                        this.tweens.add({ targets: startBtn, scaleX: startBtn.scaleX / 1.05, scaleY: startBtn.scaleY / 1.05, duration: 100 });
                    });
                }
                startBtn.on('pointerdown', () => {
                    playRandomSFX(this, 'button');
                    this.scene.start('StageSelectScene');
                });

                let upgradeBtn = this.add.image(upgradeX, startY, 'game_upgrade').setDisplaySize(baseSize, baseSize).setInteractive();
                if(upgradeBtn.preFX) {
                    upgradeBtn.preFX.setPadding(32);
                    let upgradeGlow = upgradeBtn.preFX.addGlow(0xffcc00, 4, 0, false);
                    upgradeGlow.active = false;
                    upgradeBtn.on('pointerover', () => { 
                        upgradeGlow.active = true;
                        this.tweens.add({ targets: upgradeBtn, scaleX: upgradeBtn.scaleX * 1.05, scaleY: upgradeBtn.scaleY * 1.05, duration: 100 });
                    });
                    upgradeBtn.on('pointerout', () => { 
                        upgradeGlow.active = false;
                        this.tweens.add({ targets: upgradeBtn, scaleX: upgradeBtn.scaleX / 1.05, scaleY: upgradeBtn.scaleY / 1.05, duration: 100 });
                    });
                }
                upgradeBtn.on('pointerdown', () => {
                    playRandomSFX(this, 'button');
                    this.scene.start('UpgradeScene');
                });

                let exitX = isMobile ? this.scale.width / 2 : 40;
                let exitY = isMobile ? this.scale.height - 40 : 85;
                let exitOrigin = isMobile ? 0.5 : 0;

                let exitBtn = this.add.text(exitX, exitY, '◀ 메인 허브로', {
                    fontSize: isMobile ? '20px' : '16px', 
                    fill: '#aaa', 
                    backgroundColor: '#222', 
                    padding: { x: 12, y: 8 }, 
                    borderRadius: 6
                }).setOrigin(exitOrigin, 0.5).setInteractive();
                
                exitBtn.on('pointerover', () => exitBtn.setBackgroundColor('#aa7722').setFill('#fff'));
                exitBtn.on('pointerout', () => exitBtn.setBackgroundColor('#222').setFill('#aaa'));
                exitBtn.on('pointerdown', () => {
                    playRandomSFX(this, 'button');
                    window.location.href = '/game';
                });
            }
        }

        class UpgradeScene extends Phaser.Scene {
            constructor() { super({ key: 'UpgradeScene' }); }

            create() {
                playBGM(this, 'survive_main');
                createMuteButton(this);

                let cx = this.scale.width / 2;
                this.add.text(cx, isMobile ? 50 : 60, '영구 능력 강화 상점', { 
                    fontSize: isMobile ? '32px' : '38px', fill: '#ffcc00', fontStyle: 'bold', padding: { top: 8, bottom: 8 } 
                }).setOrigin(0.5);

                this.goldTxt = this.add.text(cx, isMobile ? 95 : 110, `보유 골드: ${USER_GLOBAL_DATA.survive_gold} G`, { 
                    fontSize: isMobile ? '20px' : '24px', fill: '#ffd700', fontStyle: 'bold', padding: { top: 6, bottom: 6 } 
                }).setOrigin(0.5);

                const upgradeList = [
                    { key: 'ATTACK_POWER_LV', name: '공격력 강화', desc: '기본 공격력 +1 증가', currentLv: USER_GLOBAL_DATA.upgrades.attack_power_lv },
                    { key: 'ATTACK_SPEED_LV', name: '공격속도 강화', desc: '공격 대기시간 -5% 감소', currentLv: USER_GLOBAL_DATA.upgrades.attack_speed_lv },
                    { key: 'MOVE_SPEED_LV', name: '이동속도 강화', desc: '플레이어 이동속도 +10 증가', currentLv: USER_GLOBAL_DATA.upgrades.move_speed_lv },
                    { key: 'MAX_HP_LV', name: '최대체력 강화', desc: '기본 최대 체력 +15 증가', currentLv: USER_GLOBAL_DATA.upgrades.max_hp_lv },
                    { key: 'MAGNET_RANGE_LV', name: '자력 범위 강화', desc: '아이템 습득 범위 +30 증가', currentLv: USER_GLOBAL_DATA.upgrades.magnet_range_lv },
                    { key: 'DEFENSE_LV', name: '방어력 강화', desc: '피격 시 데미지 -1 감쇄', currentLv: USER_GLOBAL_DATA.upgrades.defense_lv },
                    { key: 'EXP_BONUS_LV', name: '경험치 획득 강화', desc: '경험치 획득량 +10% 증가', currentLv: USER_GLOBAL_DATA.upgrades.exp_bonus_lv }
                ];

                let startY = isMobile ? 155 : 170;
                let itemHeight = isMobile ? 120 : 65;

                upgradeList.forEach((item, idx) => {
                    let posY = startY + (idx * itemHeight);
                    let cost = 100 + (item.currentLv * 150);

                    if (isMobile) {
                        this.add.rectangle(cx, posY, 660, 105, 0x222233, 0.9).setStrokeStyle(2, 0x4466aa);
                        this.add.text(cx - 310, posY - 32, `${item.name} (Lv.${item.currentLv})`, { fontSize: '20px', fill: '#ffffff', fontStyle: 'bold', padding: { top: 4, bottom: 4 } });
                        this.add.text(cx - 310, posY - 2, item.desc, { fontSize: '15px', fill: '#aaaaaa', padding: { top: 4, bottom: 4 } });

                        let buyBtn = this.add.text(cx + 190, posY + 10, `강화 (${cost} G)`, {
                            fontSize: '18px', fill: '#fff', backgroundColor: '#aa6600', padding: { x: 16, y: 8 }
                        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                        buyBtn.on('pointerdown', () => {
                            playRandomSFX(this, 'button');
                            fetch('/api/survive/upgrade', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ stat_type: item.key })
                            })
                            .then(res => res.json())
                            .then(resData => {
                                if (resData.success) {
                                    USER_GLOBAL_DATA.survive_gold = resData.new_gold;
                                    USER_GLOBAL_DATA.upgrades[item.key.toLowerCase()] = resData.new_level;
                                    this.scene.restart();
                                } else {
                                    alert(resData.error || "강화 실패");
                                }
                            });
                        });
                    } else {
                        this.add.rectangle(cx, posY, 750, 55, 0x222233, 0.9).setStrokeStyle(2, 0x4466aa);
                        this.add.text(cx - 340, posY - 12, `${item.name} (Lv.${item.currentLv})`, { fontSize: '18px', fill: '#ffffff', fontStyle: 'bold', padding: { top: 4, bottom: 4 } });
                        this.add.text(cx - 340, posY + 8, item.desc, { fontSize: '13px', fill: '#aaaaaa', padding: { top: 4, bottom: 4 } });

                        let buyBtn = this.add.text(cx + 260, posY, `강화 (${cost} G)`, {
                            fontSize: '16px', fill: '#fff', backgroundColor: '#aa6600', padding: { x: 12, y: 6 }
                        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                        buyBtn.on('pointerdown', () => {
                            playRandomSFX(this, 'button');
                            fetch('/api/survive/upgrade', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ stat_type: item.key })
                            })
                            .then(res => res.json())
                            .then(resData => {
                                if (resData.success) {
                                    USER_GLOBAL_DATA.survive_gold = resData.new_gold;
                                    USER_GLOBAL_DATA.upgrades[item.key.toLowerCase()] = resData.new_level;
                                    this.scene.restart();
