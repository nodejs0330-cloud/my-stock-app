                    { id: 'bolt', type: 'normal', name: '뇌둔: 번개 소환', desc: '랜덤 위치 번개 폭격 (다음 레벨: 번개 +3개 & 데미지 +6 상승)', statKey: 'bolt', icon: 'scroll_bolt', maxLv: 5 },
                    { id: 'posion', type: 'normal', name: '닌자 비전: 병량환', desc: '공격속도 상승 및 모든 스킬 데미지 +10% 대폭 증가', statKey: 'posionLv', icon: 'ninja_posion', maxLv: 3 },
                    { id: 'hp', type: 'normal', name: '체력 한계 돌파', desc: '최대 체력을 +20 늘리고 체력을 회복합니다.', statKey: 'maxHpLv', icon: 'ninja_hp_posion', maxLv: 10 },
                    { id: 'speed', type: 'normal', name: '족경술: 이속 증가', desc: '플레이어의 이동속도를 +12 증가시킵니다.', statKey: 'speedLv', icon: 'ninja_speed', maxLv: 5 },
                    { id: 'wind', type: 'rare', name: '[레어] 풍둔: 나선 수리검', desc: '상대를 갈아버리는 나선수리검 (다음 레벨: 데미지 +2.875 상승)', statKey: 'wind', icon: 'scroll_rasenshuriken', maxLv: 5 },
                    { id: 'pierce', type: 'rare', name: '[레어] 관통의 인', desc: pLv === 0 ? '수둔/기폭찰 데미지 +50%, 화둔/나선 데미지 +20% 상승 (기본 수리검 관통+1)' : '모든 스킬 데미지 추가 +5% 상승', statKey: 'pierce', icon: 'scroll_pierce', maxLv: 3 },
                    { id: 'clone', type: 'rare', name: '[레어] 분신술', desc: '기본공격, 기폭찰, 나선수리검 발사 수 +1', statKey: 'clone', icon: 'scroll_clone', maxLv: 3 },
                    { id: 'magnet', type: 'rare', name: '[레어] 노획 (자력)', desc: '경험치 및 골드 획득 범위 +40 넓힙니다.', statKey: 'magnet', icon: 'scroll_magnet', maxLv: 5 }
                ];

                let available = rewardPool.filter(r => {
                    if (isRareOnly && r.type !== 'rare') return false;
                    return (this.playerStats[r.statKey] || 0) < r.maxLv;
                });

                if (available.length < 3) {
                    while(available.length < 3) {
                        available.push({ id: 'heal', type: 'normal', name: '체력 회복', desc: '체력을 즉시 20 회복합니다.', statKey: 'healLv', icon: 'ninja_hp_posion', maxLv: 999 });
                    }
                }

                let shuffled = Phaser.Utils.Array.Shuffle([...available]);
                let selected = shuffled.slice(0, 3);

                let cardWidth = isMobile ? 620 : 680;
                let cardHeight = isMobile ? 125 : 110;
                let cardSpacing = isMobile ? 145 : 125;
                let startY = isMobile ? 220 : 190;
                let cardX = this.scale.width / 2;

                selected.forEach((reward, idx) => {
                    let posY = startY + (idx * cardSpacing);
                    let isRare = reward.type === 'rare';

                    let strokeColor = isRare ? 0xffcc00 : 0x00aaff;
                    let cardBg = this.add.rectangle(cardX, posY, cardWidth, cardHeight, isRare ? 0x3d2b00 : 0x112233, 0.95)
                        .setStrokeStyle(3, strokeColor)
                        .setScrollFactor(0)
                        .setDepth(20001)
                        .setInteractive({ useHandCursor: true });

                    let iconKey = reward.icon || 'box';
                    if (!this.textures.exists(iconKey)) iconKey = (isRare ? 'rare_box' : 'box');

                    let icon = this.add.image(cardX - (cardWidth / 2) + 60, posY, iconKey)
                        .setScrollFactor(0)
                        .setDepth(20002);

                    if (iconKey === 'ninja_hp_posion') {
                        icon.setDisplaySize(40, 58);
                    } else if (iconKey === 'ninja_speed') {
                        icon.setDisplaySize(50, 50);
                    } else if (iconKey === 'ninja_posion') {
                        icon.setDisplaySize(39, 42);
                    } else {
                        icon.setDisplaySize(65, 65);
                    }

                    let curLv = this.playerStats[reward.statKey] || 0;
                    let textStartX = cardX - (cardWidth / 2) + 110;

                    let nameTxt = this.add.text(textStartX, posY - 28, reward.name, { 
                        fontSize: '20px', fill: isRare ? '#ffdd00' : '#ffffff', fontStyle: 'bold', padding: { top: 4, bottom: 4 } 
                    }).setScrollFactor(0).setDepth(20002);

                    let descTxt = this.add.text(textStartX, posY - 2, reward.desc, { 
                        fontSize: '13px', fill: '#cccccc', padding: { top: 4, bottom: 4 } 
                    }).setScrollFactor(0).setDepth(20002);
                    
                    let lvTxt = null;
                    if(reward.id !== 'heal') {
                        lvTxt = this.add.text(textStartX, posY + 22, `Lv.${curLv} ➔ Lv.${curLv + 1} (Max: Lv.${reward.maxLv})`, { 
                            fontSize: '13px', fill: '#00ffcc', padding: { top: 2, bottom: 2 } 
                        }).setScrollFactor(0).setDepth(20002);
                    }

                    this.levelUpElements.push(cardBg, icon, nameTxt, descTxt);
                    if(lvTxt) this.levelUpElements.push(lvTxt);

                    let glowTween = null;

                    cardBg.on('pointerover', (pointer, localX, localY, event) => {
                        if(event) event.stopPropagation();
                        cardBg.setFillStyle(isRare ? 0x664400 : 0x224466);
                        
                        glowTween = this.tweens.add({
                            targets: cardBg,
                            scaleX: 1.02,
                            scaleY: 1.02,
                            duration: 150,
                            yoyo: true,
                            repeat: -1
                        });
                    });

                    cardBg.on('pointerout', (pointer, localX, localY, event) => {
                        if(event) event.stopPropagation();
                        cardBg.setFillStyle(isRare ? 0x3d2b00 : 0x112233);
                        if(glowTween) {
                            glowTween.stop();
                            cardBg.setScale(1);
                        }
                    });

                    cardBg.on('pointerdown', (pointer, localX, localY, event) => {
                        if(event) event.stopPropagation();
                        playRandomSFX(this, 'button');
                        this.applyReward(reward);
                        this.closeLevelUpUI();
                    });
                });
            }

            closeLevelUpUI() {
                if (this.levelUpElements) {
                    this.levelUpElements.forEach(el => el.destroy());
                    this.levelUpElements = [];
                }

                if (this.pendingLevelUps > 0) {
                    this.pendingLevelUps--;
                    if (this.pendingLevelUps > 0) {
                        this.time.delayedCall(100, () => this.showLevelUpUI(false));
                        return;
                    }
                }

                this.isLevelUpOpen = false;
                this.physics.resume();
            }

            showShopUI() {
                this.isLevelUpOpen = true;
                this.physics.pause();
                
                this.shopElements = [];

                let overlay = this.add.rectangle(this.scale.width / 2, this.scale.height / 2, this.scale.width, this.scale.height, 0x000000, 0.85)
                    .setScrollFactor(0)
                    .setDepth(20000)
                    .setInteractive();

                let title = this.add.text(this.scale.width / 2, 90, '인게임 골드 상점', { 
                    fontSize: isMobile ? '34px' : '42px', fill: '#ffcc00', fontStyle: 'bold', padding: { top: 8, bottom: 8 } 
                }).setOrigin(0.5).setScrollFactor(0).setDepth(20002);

                let goldInfo = this.add.text(this.scale.width / 2, 135, `획득한 골드: ${this.playerStats.gold} G`, { 
                    fontSize: isMobile ? '18px' : '22px', fill: '#ffd700', padding: { top: 6, bottom: 6 } 
                }).setOrigin(0.5).setScrollFactor(0).setDepth(20002);

                this.shopElements.push(overlay, title, goldInfo);

                let unlockedSkills = USER_GLOBAL_DATA.unlocked_boss_skills || [];
                let cx = this.scale.width / 2;

                let isDuckSkillUnlocked = unlockedSkills.some(s => s.skill_key === 'boss_sli_wave' || s.skill_key === 'boss_duck');

                let posY = 220;
                let cost = 500;

                let card = this.add.rectangle(cx, posY, isMobile ? 620 : 550, 70, 0x113322, 0.9).setStrokeStyle(2, 0x00ffcc).setScrollFactor(0).setDepth(20001);
                
                let skTxtStr = isDuckSkillUnlocked ? "[보스 스킬] 붕어빵 융단폭격" : "🔒 [미획득] Stage 1 클리어 필요";
                let skTxt = this.add.text(cx - (isMobile ? 270 : 240), posY - 10, skTxtStr, { 
                    fontSize: '18px', fill: isDuckSkillUnlocked ? '#fff' : '#888', fontStyle: 'bold', padding: { top: 4, bottom: 4 } 
                }).setScrollFactor(0).setDepth(20002);

                let buyBtn = this.add.text(cx + (isMobile ? 200 : 170), posY, isDuckSkillUnlocked ? `장착 (${cost}G)` : '구매 불가', {
                    fontSize: '16px', fill: '#fff', backgroundColor: isDuckSkillUnlocked ? '#00aa66' : '#444444', padding: { x: 12, y: 6 }
                }).setOrigin(0.5).setScrollFactor(0).setDepth(20002).setInteractive({ useHandCursor: true });

                buyBtn.on('pointerdown', (pointer, localX, localY, event) => {
                    if(event) event.stopPropagation();
                    if (!isDuckSkillUnlocked) {
                        playRandomSFX(this, 'button');
                        alert("🔒 Stage 1을 클리어하여 스킬을 해금해야 이용할 수 있습니다!");
                        return;
                    }

                    if (this.playerStats.gold >= cost) {
                        this.playerStats.gold -= cost;
                        this.goldText.setText(`${this.playerStats.gold}`);
                        goldInfo.setText(`획득한 골드: ${this.playerStats.gold} G`);
                        
                        this.playerStats.hasEquippedBossSkill = true;
                        this.bossSkillBox.setVisible(true);
                        this.bossSkillBtn.setVisible(true);

                        playRandomSFX(this, 'skill_fire');
                        alert("✅ [붕어빵 융단폭격] 보스 스킬이 2번 슬롯에 장착되었습니다!\n(단축키: 키보드 2번 / 쿨타임 60초)");
                    } else {
                        playRandomSFX(this, 'button');
                        alert("❌ 골드가 부족합니다. (필요 골드: 500 G)");
                    }
                });

                this.shopElements.push(card, skTxt, buyBtn);

                let closeBtnY = isMobile ? this.scale.height - 100 : this.scale.height - 80;
                let closeBtn = this.add.text(cx, closeBtnY, '닫기', {
                    fontSize: isMobile ? '24px' : '28px', fill: '#fff', backgroundColor: '#555', padding: { x: 30, y: 10 }
                }).setOrigin(0.5).setScrollFactor(0).setDepth(20002).setInteractive({ useHandCursor: true });

                closeBtn.on('pointerover', () => closeBtn.setBackgroundColor('#aa7722').setFill('#fff'));
                closeBtn.on('pointerout', () => closeBtn.setBackgroundColor('#555').setFill('#fff'));

                this.shopElements.push(closeBtn);

                closeBtn.on('pointerdown', (pointer, localX, localY, event) => {
                    if(event) event.stopPropagation();
                    playRandomSFX(this, 'button');
                    if (this.shopElements) {
                        this.shopElements.forEach(el => el.destroy());
                        this.shopElements = [];
                    }
                    this.isLevelUpOpen = false;
                    this.physics.resume();
                });
            }

            applyReward(reward) {
                if (!this.playerStats[reward.statKey]) this.playerStats[reward.statKey] = 0;
                this.playerStats[reward.statKey]++;

                if (reward.id === 'posion') {
                    this.playerStats.attackDelay = Math.max(400, 1100 - (this.playerStats.posionLv * 233));
                }
                else if (reward.id === 'hp') { this.playerStats.maxHp += 20; this.playerStats.hp += 20; }
                else if (reward.id === 'speed') { this.playerStats.speed += 12; }
                else if (reward.id === 'magnet') { this.playerStats.magnetRange += 40; }
                else if (reward.id === 'heal') { this.playerStats.hp = Math.min(this.playerStats.hp + 20, this.playerStats.maxHp); }
                
                this.updateHpUI();
            }
        }

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: GAME_WIDTH, height: GAME_HEIGHT },
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: [PreloadScene, TitleScene, UpgradeScene, StageSelectScene, GameScene]
        };
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
