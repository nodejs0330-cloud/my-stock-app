<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCS SURVIVE - {{ username }}님</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- 1. 전역 설정, 상태 및 공통 유틸리티 -->
    <script src="/static/js/survive/config.js?v=5.0"></script>

    <!-- 2. Scene 클래스 분리 파일 -->
    <script src="/static/js/survive/scenes/PreloadScene.js?v=5.0"></script>
    <script src="/static/js/survive/scenes/TitleScene.js?v=5.0"></script>
    <script src="/static/js/survive/scenes/UpgradeScene.js?v=5.0"></script>
    <script src="/static/js/survive/scenes/StageSelectScene.js?v=5.0"></script>
    <script src="/static/js/survive/scenes/GameScene.js?v=5.0"></script>

    <!-- 3. Phaser 게임 인스턴스 초기화 -->
    <script>
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: GAME_WIDTH, height: GAME_HEIGHT },
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: [PreloadScene, TitleScene, UpgradeScene, StageSelectScene, GameScene]
        };
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
