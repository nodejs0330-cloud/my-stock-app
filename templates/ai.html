{% extends 'base.html' %}
{% block body_class %}bg-[#f4f4f5]{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes glow-pulse {
    0% { box-shadow: 0 0 12px rgba(9, 9, 11, 0.05); }
    100% { box-shadow: 0 0 24px rgba(9, 9, 11, 0.12); }
}
    .glow-effect { animation: glow-pulse 3s infinite alternate; }
</style>

<div class="w-full h-[100dvh] flex flex-col relative z-10 overflow-hidden text-[#09090b] font-sans">

    <div class="flex-grow w-full max-w-4xl mx-auto flex flex-col relative pt-2 pb-[140px] md:pb-32 px-4 overflow-y-auto no-scrollbar" id="chat-container">
        
        <!-- 모델 선택 스위처 -->
        <div class="flex justify-center mb-4 md:mb-8 sticky top-0 z-30 pt-2">
            <div class="bg-white border border-[#e4e4e7] rounded-full p-1 flex shadow-sm space-x-1 overflow-x-auto no-scrollbar">
                <button id="btn-gemini-model" onclick="switchModel('gemini')" class="px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-[#18181b] text-white shadow-xs whitespace-nowrap">
                    NCS 텍스트 비서 <span class="text-[10px] text-[#a1a1aa] ml-1 font-mono font-normal">Gemini 2.5</span>
                </button>
                <button id="btn-text-model" onclick="switchModel('text')" class="px-4 py-1.5 rounded-full text-xs font-medium transition-all text-[#71717a] hover:text-[#09090b] whitespace-nowrap">
                    NCS 텍스트 비서 <span class="text-[10px] text-[#71717a] ml-1 font-mono">Llama-3.3</span>
                </button>
                <button id="btn-image-model" onclick="switchModel('image')" class="px-4 py-1.5 rounded-full text-xs font-medium transition-all text-[#71717a] hover:text-[#09090b] whitespace-nowrap">
                    NCS 상상 화가 <span class="text-[10px] text-[#71717a] ml-1 font-mono">Flux.1</span>
                </button>
            </div>
        </div>

        <!-- Gemini 스타일 메인 웰컴 영역 -->
        <div id="welcome-message" class="flex flex-col items-center justify-center flex-grow mt-2 md:mt-8 transition-opacity duration-500 min-h-[300px]">
            <div class="mb-5 text-[#09090b] flex justify-center">
                <svg class="w-12 h-12 md:w-16 md:h-16 animate-pulse" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0C12 6.627 17.373 12 24 12C17.373 12 12 17.373 12 24C12 17.373 6.627 12 0 12C6.627 12 12 6.627 12 0Z"/>
                </svg>
            </div>
            
            <h1 class="text-3xl md:text-5xl font-extrabold text-center tracking-tight mb-8 leading-tight text-[#09090b]">
                <span>{{ session.name }}님,</span><br>
                <span id="dynamic-greeting" class="text-[#71717a] mt-2 block text-xl md:text-3xl font-bold">무엇을 도와드릴까요?</span>
            </h1>
            
            <!-- 추천 질문 (2열 고정) -->
            <div class="grid grid-cols-2 gap-2.5 md:gap-3.5 w-full max-w-2xl px-1" id="suggested-queries">
                <button onclick="setInputAndSend(`{{ rec_q1 }}`)" class="bg-white hover:bg-[#f4f4f5] border border-[#e4e4e7] p-3.5 md:p-4 rounded-2xl text-left transition-all shadow-xs group flex flex-col justify-between">
                    <div class="mb-2 text-[#09090b]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0v-8m0 8l-8-8-4 4-6-6"/></svg>
                    </div>
                    <span class="text-xs font-medium text-[#09090b] line-clamp-3 md:line-clamp-2 leading-relaxed">{{ rec_q1 }}</span>
                </button>
                <button onclick="setInputAndSend(`{{ rec_q2 }}`)" class="bg-white hover:bg-[#f4f4f5] border border-[#e4e4e7] p-3.5 md:p-4 rounded-2xl text-left transition-all shadow-xs group flex flex-col justify-between">
                    <div class="mb-2 text-[#09090b]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    </div>
                    <span class="text-xs font-medium text-[#09090b] line-clamp-3 md:line-clamp-2 leading-relaxed">{{ rec_q2 }}</span>
                </button>
            </div>
        </div>

        <div id="chat-messages" class="w-full space-y-5 hidden pb-10"></div>
    </div>

    <!-- 하단 Floating 입력 폼 -->
    <div class="fixed bottom-16 md:bottom-0 left-0 w-full bg-gradient-to-t from-[#f4f4f5] via-[#f4f4f5] to-transparent pt-10 pb-4 md:pb-6 z-50">
        <div class="max-w-3xl mx-auto px-4 relative">
            <div id="nvidia-warning" class="hidden text-[10px] text-[#09090b] font-medium bg-white border border-[#e4e4e7] rounded-lg p-2 mb-2 text-center shadow-xs animate-pulse">
                ⚠️ 서버 트래픽 혼잡 시 응답이 지연될 수 있으며, 지연 지속 시 Gemini 모델로 전환됩니다.
            </div>
            <div class="relative flex items-center bg-white border border-[#e4e4e7] rounded-full shadow-lg p-1.5 focus-within:border-[#18181b] transition-all">
                <input type="text" id="ai-input" class="w-full bg-transparent text-[#09090b] placeholder-[#a1a1aa] px-4 py-2.5 focus:outline-none text-xs md:text-sm font-medium" placeholder="무엇이든 물어보세요..." autocomplete="off">
                <button id="send-btn" onclick="sendMessage()" class="bg-[#18181b] hover:bg-[#27272a] text-white w-9 h-9 rounded-full flex items-center justify-center transition-all active:scale-95 shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
            </div>
            <p class="text-[10px] text-[#71717a] text-center mt-2.5 hidden md:block font-sans">NCS AI는 실수를 할 수 있습니다. 중요한 정보는 직접 확인하세요.</p>
        </div>
    </div>
</div>

<script>
    const greetings = [
        "오늘 어떤 통찰을 얻고 싶으신가요?",
        "어떤 영감이 필요하신가요?",
        "투자에 대한 고민, 함께 나누어 볼까요?",
        "새로운 아이디어가 필요하신가요?",
        "무엇이든 물어보세요."
    ];
    document.getElementById('dynamic-greeting').innerText = greetings[Math.floor(Math.random() * greetings.length)];

    let currentMode = 'gemini'; 
    const chatHistory = [];
    const chatContainer = document.getElementById('chat-container');
    const messagesDiv = document.getElementById('chat-messages');
    const welcomeDiv = document.getElementById('welcome-message');
    const inputEl = document.getElementById('ai-input');
    const sendBtn = document.getElementById('send-btn');
    const suggestedQueries = document.getElementById('suggested-queries');
    const nvidiaWarning = document.getElementById('nvidia-warning');
    
    let isUserScrolling = false;
    chatContainer.addEventListener('scroll', () => {
        const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop <= chatContainer.clientHeight + 10;
        isUserScrolling = !isAtBottom;
    });

    function scrollToBottom() {
        if (!isUserScrolling) {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }
    }

    let abortController = null;
    let timeoutTimer = null;

    function switchModel(mode) {
        currentMode = mode;
        const btnGemini = document.getElementById('btn-gemini-model');
        const btnText = document.getElementById('btn-text-model');
        const btnImage = document.getElementById('btn-image-model');
        
        btnGemini.className = "px-4 py-1.5 rounded-full text-xs font-medium transition-all text-[#71717a] hover:text-[#09090b] whitespace-nowrap";
        btnText.className = "px-4 py-1.5 rounded-full text-xs font-medium transition-all text-[#71717a] hover:text-[#09090b] whitespace-nowrap";
        btnImage.className = "px-4 py-1.5 rounded-full text-xs font-medium transition-all text-[#71717a] hover:text-[#09090b] whitespace-nowrap";
        
        btnGemini.innerHTML = 'NCS 텍스트 비서 <span class="text-[10px] text-[#71717a] ml-1 font-mono">Gemini 2.5</span>';
        btnText.innerHTML = 'NCS 텍스트 비서 <span class="text-[10px] text-[#71717a] ml-1 font-mono">Llama-3.3</span>';
        btnImage.innerHTML = 'NCS 상상 화가 <span class="text-[10px] text-[#71717a] ml-1 font-mono">Flux.1</span>';
        
        if (mode === 'gemini') {
            btnGemini.className = "px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-[#18181b] text-white shadow-xs whitespace-nowrap";
            btnGemini.innerHTML = 'NCS 텍스트 비서 <span class="text-[10px] text-[#a1a1aa] ml-1 font-mono font-normal">Gemini 2.5</span>';
            inputEl.placeholder = "무엇이든 물어보세요 (초고속 응답)...";
            suggestedQueries.classList.remove('hidden');
            nvidiaWarning.classList.add('hidden');
        } else if (mode === 'text') {
            btnText.className = "px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-[#18181b] text-white shadow-xs whitespace-nowrap";
            btnText.innerHTML = 'NCS 텍스트 비서 <span class="text-[10px] text-[#a1a1aa] ml-1 font-mono font-normal">Llama-3.3</span>';
            inputEl.placeholder = "무엇이든 물어보세요...";
            suggestedQueries.classList.remove('hidden');
            nvidiaWarning.classList.remove('hidden');
        } else {
            btnImage.className = "px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-[#18181b] text-white shadow-xs whitespace-nowrap";
            btnImage.innerHTML = 'NCS 상상 화가 <span class="text-[10px] text-[#a1a1aa] ml-1 font-mono font-normal">Flux.1</span>';
            inputEl.placeholder = "생성할 이미지를 묘사해주세요...";
            suggestedQueries.classList.add('hidden');
            nvidiaWarning.classList.remove('hidden');
        }
    }

    function setInputAndSend(text) {
        inputEl.value = text;
        sendMessage();
    }
    
    window.cancelAIRequest = function() {
        if (abortController) {
            abortController.abort();
        }
    }

    function appendMessage(role, content, type = 'text') {
        welcomeDiv.classList.add('hidden');
        messagesDiv.classList.remove('hidden');

        const wrapper = document.createElement('div');
        wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
        
        const bubble = document.createElement('div');
        if (role === 'user') {
            bubble.className = "bg-[#18181b] text-white px-4 py-3 rounded-2xl rounded-tr-xs max-w-[85%] sm:max-w-lg text-xs md:text-sm leading-relaxed shadow-sm font-medium";
            bubble.textContent = content;
        } else {
            bubble.className = "text-[#09090b] px-1 py-1 w-full max-w-3xl text-xs md:text-sm leading-relaxed flex flex-col";
            const iconHtml = `
            <div class="w-7 h-7 rounded-full bg-[#18181b] flex items-center justify-center text-white mb-2.5 shrink-0 shadow-xs">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C12 6.627 17.373 12 24 12C17.373 12 12 17.373 12 24C12 17.373 6.627 12 0 12C6.627 12 12 6.627 12 0Z"/></svg>
            </div>`;
            
            let contentHtml = '';
            if (type === 'text') {
                let formatted = content.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b class="text-[#09090b] font-extrabold">$1</b>');
                contentHtml = `<div class="prose prose-neutral max-w-none text-xs md:text-sm">${formatted}</div>`;
            } else if (type === 'typing') {
                contentHtml = `<div class="prose prose-neutral max-w-none text-content text-xs md:text-sm"></div>`;
            } else if (type === 'image') {
                contentHtml = `<img src="data:image/jpeg;base64,${content}" class="rounded-xl shadow-lg max-w-full h-auto mt-2 border border-[#e4e4e7]" alt="Generated Image">`;
            } else if (type === 'loading') {
                contentHtml = `
                <div class="flex items-center justify-between w-full max-w-xs">
                    <div class="flex items-center space-x-2 text-[#09090b] font-medium animate-pulse mt-0.5">
                        <div class="w-1.5 h-1.5 bg-[#09090b] rounded-full"></div>
                        <div class="w-1.5 h-1.5 bg-[#09090b] rounded-full" style="animation-delay: 0.2s"></div>
                        <div class="w-1.5 h-1.5 bg-[#09090b] rounded-full" style="animation-delay: 0.4s"></div>
                        <span class="ml-2 text-xs">생각 중...</span>
                    </div>
                    <button onclick="cancelAIRequest()" class="ml-4 text-[10px] font-bold bg-[#f4f4f5] hover:bg-[#e4e4e7] text-[#09090b] border border-[#e4e4e7] px-2.5 py-1 rounded-md transition">
                        대화 중지
                    </button>
                </div>`;
            }

            bubble.innerHTML = `${iconHtml}${contentHtml}`;
        }

        wrapper.appendChild(bubble);
        messagesDiv.appendChild(wrapper);
        
        if (!isUserScrolling) {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'instant' });
        }
        return wrapper;
    }

    function typeWriter(element, text, speed = 15) {
        return new Promise(resolve => {
            let i = 0;
            element.innerHTML = '';
            const interval = setInterval(() => {
                let currentText = text.substring(0, i);
                element.innerHTML = currentText.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b class="text-[#09090b] font-extrabold">$1</b>');
                scrollToBottom();
                i++;
                if (i > text.length) {
                    clearInterval(interval);
                    resolve();
                }
            }, speed);
        });
    }

    async function sendMessage(retryText = null, skipHistory = false) {
        const text = retryText || inputEl.value.trim();
        if (!text) return;
        
        if (!retryText && !skipHistory) {
            isUserScrolling = false; 
            appendMessage('user', text);
            chatHistory.push({ role: "user", content: text });
        }

        inputEl.value = '';
        inputEl.disabled = true;
        sendBtn.disabled = true;

        const loadingNode = appendMessage('assistant', '', 'loading');
        abortController = new AbortController();
        let isSwitched = false; 

        clearTimeout(timeoutTimer);
        timeoutTimer = setTimeout(() => {
            if (currentMode === 'text' && !abortController.signal.aborted) {
                if (confirm("서버가 혼잡하여 로딩이 길어지고 있습니다. 속도가 빠른 Gemini로 변경하여 답변을 받으시겠습니까?")) {
                    isSwitched = true;
                    abortController.abort(); 
                    switchModel('gemini');   
                    
                    messagesDiv.removeChild(loadingNode);
                    chatHistory.pop(); 
                    sendMessage(text);
                }
            }
        }, 70000); 

        try {
            if (currentMode === 'gemini' || currentMode === 'text') {
                const res = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory, vendor: currentMode }),
                    signal: abortController.signal
                });
                
                clearTimeout(timeoutTimer); 
                const data = await res.json();
                
                messagesDiv.removeChild(loadingNode);
                
                if (data.error) {
                    appendMessage('assistant', "오류: " + data.error);
                    chatHistory.pop(); 
                } else {
                    const msgNode = appendMessage('assistant', '', 'typing');
                    const textContainer = msgNode.querySelector('.text-content');
                    chatHistory.push({ role: "assistant", content: data.reply });
                    
                    await typeWriter(textContainer, data.reply);
                }

            } else if (currentMode === 'image') {
                const res = await fetch('/api/ai/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text }),
                    signal: abortController.signal
                });
                
                clearTimeout(timeoutTimer);
                const data = await res.json();
                
                messagesDiv.removeChild(loadingNode);
                
                if (data.error) {
                    appendMessage('assistant', "오류: " + data.error);
                } else {
                    appendMessage('assistant', data.b64_json, 'image');
                }
            }
        } catch (e) {
            clearTimeout(timeoutTimer);
            if(messagesDiv.contains(loadingNode)) messagesDiv.removeChild(loadingNode);
            
            if (e.name === 'AbortError') {
                if (!isSwitched) {
                    appendMessage('assistant', "대화가 중지되었습니다.");
                    chatHistory.pop();
                }
            } else {
                appendMessage('assistant', "서버 타임아웃 또는 네트워크 오류가 발생했습니다.");
                chatHistory.pop();
            }
        } finally {
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    inputEl.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
{% endblock %}
